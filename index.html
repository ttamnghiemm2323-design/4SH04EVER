<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LNGSHOT4SHO — home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0b0c;
    --black-2:#141416;
    --black-3:#1b1b1e;
    --wine:#5c1622;
    --wine-bright:#c23652;
    --blue:#1f3f57;
    --blue-bright:#3e86b5;
    --lime:#c6ff3d;
    --paper:#e8e2d1;
    --grey:#8d8a83;
    --grey-dim:#3a3834;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Space Mono',monospace;
    background:var(--black);
    color:var(--paper);
    padding-bottom:34px;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}

  .win{
    border:1px solid var(--grey-dim);
    border-radius:7px;
    overflow:hidden;
    background:var(--black-2);
    box-shadow:6px 6px 0 rgba(0,0,0,.55);
  }
  .win-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 8px 7px 12px;
    background:linear-gradient(180deg, var(--accent, var(--wine)), color-mix(in srgb, var(--accent, var(--wine)) 55%, black));
    border-bottom:1px solid rgba(0,0,0,.4);
    font-family:'Anton',sans-serif;
    font-size:12px;
    letter-spacing:1px;
    color:var(--paper);
    text-shadow:1px 1px 0 rgba(0,0,0,.4);
  }
  .win-bar .win-name{display:flex;align-items:center;gap:6px;}
  .win-dots{display:flex;gap:4px;}
  .win-dots span{
    width:15px;height:14px;
    border:1px solid rgba(232,226,209,.6);
    border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;
    line-height:1;
    color:var(--paper);
    background:rgba(0,0,0,.15);
  }
  .win-body{padding:16px;}

  .ticker{
    background:var(--black-3);
    border-bottom:1px solid var(--grey-dim);
    overflow:hidden;
    white-space:nowrap;
    font-size:11px;
    letter-spacing:1px;
    padding:7px 0;
  }
  .ticker-track{
    display:inline-block;
    animation:scroll-left 26s linear infinite;
  }
  .ticker-track span{margin:0 26px; color:var(--grey);}
  .ticker-track span b{color:var(--lime); font-weight:normal;}
  @keyframes scroll-left{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  @media (prefers-reduced-motion: reduce){ .ticker-track{animation:none;} }
  .topbar-mini{
    display:flex;
    justify-content:flex-end;
    gap:16px;
    padding:6px 22px;
    font-size:10px;
    letter-spacing:1px;
    color:var(--grey);
    background:var(--black);
    border-bottom:1px solid var(--grey-dim);
  }
  .topbar-mini a:hover{color:var(--lime);}

  header.topnav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:16px 22px;
    background:var(--black);
    border-bottom:2px solid var(--grey-dim);
    flex-wrap:wrap;
  }
  .logo{
    font-family:'Anton',sans-serif;
    font-size:26px;
    letter-spacing:1px;
    color:var(--paper);
    text-shadow:2px 2px 0 var(--wine), 4px 4px 0 var(--black);
  }
  .logo span{color:var(--blue-bright); text-shadow:2px 2px 0 var(--black);}
  nav.mainnav{
    display:flex;
    gap:26px;
    flex-wrap:wrap;
  }
  nav.mainnav a{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10px;
    letter-spacing:1px;
    color:var(--grey);
    position:relative;
  }
  nav.mainnav a .ic{font-size:15px;color:var(--paper);}
  nav.mainnav a:hover{color:var(--lime);}
  nav.mainnav a:hover .ic{color:var(--lime);}
  nav.mainnav a.locked{cursor:pointer;}
  nav.mainnav a.locked::after{
    content:'hint: search a special date...';
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%) translateY(6px);
    background:var(--lime);
    color:var(--black);
    font-size:9px;
    letter-spacing:0;
    padding:4px 8px;
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s;
    z-index:100;
    font-family:'Space Mono',monospace;
    box-shadow:2px 2px 0 rgba(0,0,0,.5);
  }
  nav.mainnav a.locked:hover::after{opacity:1;}
  .searchbar{
    display:flex;
    border:1px solid var(--grey-dim);
    border-radius:999px;
    overflow:hidden;
    background:var(--black-2);
    position:relative;
  }
  .searchbar input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-family:'Space Mono',monospace;
    font-size:11px;
    padding:9px 14px;
    width:170px;
  }
  .searchbar button{
    background:var(--wine);
    border:none;
    color:var(--paper);
    padding:0 16px;
    font-size:13px;
  }
  .searchbar.shake{animation:search-shake .4s;}
  @keyframes search-shake{
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-6px);}
    40%,80%{transform:translateX(6px);}
  }

  .page{max-width:1180px; margin:0 auto; padding:22px;}

  .layout-top{
    display:grid;
    grid-template-columns:200px 1fr 220px;
    gap:18px;
    align-items:start;
  }
  @media (max-width:900px){ .layout-top{grid-template-columns:1fr;} }

  .quicklinks ul li a{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px dashed var(--grey-dim);
    font-size:11px;
    letter-spacing:.5px;
    color:var(--paper);
  }
  .quicklinks ul li:last-child a{border-bottom:none;}
  .quicklinks ul li a:hover{color:var(--lime);}
  .note-widget{
    margin-top:16px;
    background:var(--black-3);
    border:1px dashed var(--grey-dim);
    padding:14px;
    font-size:11px;
    line-height:1.7;
    color:var(--grey);
  }
  .note-widget b{color:var(--paper);}
  .note-widget .sign{color:var(--wine-bright); display:block; margin-top:6px;}

  .hero{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    align-items:center;
  }
  @media (max-width:700px){ .hero{grid-template-columns:1fr;} }
  .hero-headline{
    font-family:'Anton',sans-serif;
    font-size:clamp(38px,5.4vw,58px);
    line-height:.95;
    letter-spacing:1px;
    background:linear-gradient(120deg, var(--blue-bright), var(--wine-bright));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:none;
    filter:drop-shadow(3px 3px 0 rgba(0,0,0,.6));
    margin-bottom:14px;
  }
  .hero-sub{
    font-size:12px;
    line-height:1.8;
    color:var(--grey);
    max-width:340px;
    margin-bottom:20px;
  }
  .hero-btns{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .btn-solid{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, color-mix(in srgb, var(--blue-bright) 70%, white 10%), var(--blue));
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:11px 22px;
    font-family:'Anton',sans-serif;
    font-size:12px;
    letter-spacing:1px;
    box-shadow:0 3px 0 rgba(0,0,0,.4);
  }
  .btn-solid.alt{background:transparent; border:1px solid var(--grey-dim); box-shadow:none;}
  .btn-solid:hover{filter:brightness(1.12);}
  .btn-solid.alt:hover{border-color:var(--lime); color:var(--lime);}
  .hero-links{
    display:flex; gap:14px;
    font-size:10px; letter-spacing:1px; color:var(--grey);
  }
  .hero-links a:hover{color:var(--lime);}

  .hero-photo-wrap{position:relative;}
  .hero-photo{
    aspect-ratio:4/5;
    border-radius:0 0 6px 6px;
    background:
      radial-gradient(circle at 30% 20%, rgba(62,134,181,.25), transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(194,54,82,.25), transparent 55%),
      var(--black-3);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hero-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .float-chip{
    position:absolute;
    background:var(--black);
    border:1px solid var(--grey-dim);
    border-radius:6px;
    padding:5px 10px;
    font-size:10px;
    letter-spacing:1px;
    color:var(--lime);
    box-shadow:3px 3px 0 rgba(0,0,0,.5);
  }
  .chip-cd{top:-14px; right:36px; border-radius:50%; width:46px; height:46px; display:flex; align-items:center; justify-content:center; padding:0; font-size:16px;}
  .chip-star{bottom:-10px; left:-10px; font-size:16px; padding:6px; color:var(--wine-bright);}
  .chip-cursor{bottom:14px; right:-14px; font-size:18px; padding:2px 5px; background:transparent; border:none; box-shadow:none; color:var(--paper);}

  .col-right .win{margin-bottom:14px;}
  .msg-body{display:flex; align-items:center; gap:10px; font-size:11px;}
  .msg-body .heart{font-size:20px; color:var(--wine-bright);}
  .msg-body button{
    margin-top:8px;
    background:var(--blue);
    border:none;
    color:var(--paper);
    font-size:10px;
    letter-spacing:1px;
    padding:6px 14px;
  }
  .np-track{display:flex; gap:10px; align-items:center; margin-bottom:10px;}
  .np-thumb{
    width:38px;height:38px;flex-shrink:0;
    background:linear-gradient(135deg, var(--blue-bright), var(--wine-bright));
  }
  .np-info{font-size:10px; line-height:1.5;}
  .np-info b{display:block; font-size:11px; color:var(--paper);}
  .np-controls{display:flex; justify-content:center; gap:16px; font-size:14px; color:var(--paper); margin-top:6px;}
  .np-controls span:hover{color:var(--lime); cursor:pointer;}
  .np-bar{height:3px; background:var(--grey-dim); margin-top:10px; position:relative;}
  .np-bar::after{content:''; position:absolute; left:0; top:0; bottom:0; width:38%; background:var(--wine-bright);}

  .sticky-note{
    background:var(--lime);
    color:var(--black);
    padding:14px;
    font-size:10px;
    line-height:1.9;
    letter-spacing:.3px;
    transform:rotate(1.2deg);
    box-shadow:4px 4px 0 rgba(0,0,0,.5);
  }
  .sticky-note b{display:block; margin-bottom:4px; font-family:'Anton',sans-serif; font-size:11px; letter-spacing:1px;}

  .promo-strip{
    margin-top:26px;
    display:grid;
    grid-template-columns:1fr 260px;
    gap:14px;
    align-items:stretch;
  }
  @media (max-width:700px){ .promo-strip{grid-template-columns:1fr;} }
  .promo-item{
    background:var(--black-2);
    border:1px solid var(--grey-dim);
    border-radius:8px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px;
  }
  .promo-item .ic{font-size:20px; color:var(--blue-bright);}
  .promo-item .tt{font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.5px;}
  .promo-item .sm{font-size:9px; color:var(--grey);}
  .join-box{
    background:var(--black-2);
    border:1px solid var(--grey-dim);
    border-radius:8px;
    padding:14px 16px;
  }
  .join-box .tt{font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.5px; margin-bottom:2px;}
  .join-box .sm{font-size:9px; color:var(--grey); margin-bottom:10px;}
  .join-row{display:flex; border-radius:999px; overflow:hidden;}
  .join-row input{
    flex:1; background:var(--black); border:1px solid var(--grey-dim); border-right:none;
    color:var(--paper); font-family:'Space Mono',monospace; font-size:10px; padding:9px 14px;
  }
  .join-row button{background:var(--wine); border:none; color:var(--paper); font-size:10px; letter-spacing:1px; padding:0 18px;}

  .grid-3{
    margin-top:22px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
  @media (max-width:900px){ .grid-3{grid-template-columns:1fr;} }

  .drop-card{display:grid; grid-template-columns:56px 1fr; gap:10px; padding:10px 0; border-bottom:1px dashed var(--grey-dim); align-items:center;}
  .drop-card:last-child{border-bottom:none;}
  .drop-thumb{aspect-ratio:1/1; border-radius:6px; background:linear-gradient(155deg, var(--tile-a), var(--tile-b));}
  .drop-name{font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.5px;}
  .drop-sub{font-size:9px; color:var(--grey); margin:2px 0 6px;}
  .drop-card button{
    background:transparent; border:1px solid var(--grey-dim); color:var(--paper);
    border-radius:999px;
    font-size:9px; letter-spacing:1px; padding:4px 12px;
  }
  .drop-card button:hover{border-color:var(--lime); color:var(--lime);}

  .block-photos{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;}
  .block-photo{aspect-ratio:1/1; border-radius:6px; background:var(--black-3); border:1px solid var(--grey-dim); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--grey-dim);}
  .block-tag{font-size:10px; color:var(--grey); margin-bottom:10px;}
  .block-tag b{color:var(--lime);}
  .upload-btn{width:100%; border-radius:999px; background:linear-gradient(180deg, color-mix(in srgb, var(--blue-bright) 70%, white 10%), var(--blue)); border:none; color:var(--paper); font-family:'Anton',sans-serif; font-size:11px; letter-spacing:1px; padding:9px; box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .upload-btn:hover{filter:brightness(1.12);}

  .pl-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--grey-dim); font-size:10px;}
  .pl-row:last-child{border-bottom:none;}
  .pl-row .n{color:var(--grey); width:16px;}
  .pl-row .t{flex:1;}
  .pl-row .d{color:var(--grey);}
  .pl-row.now{color:var(--lime);}
  .pl-row.now .n{color:var(--lime);}

  .socials-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .social-btn{
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    background:var(--black-3); border:1px solid var(--grey-dim); border-radius:6px;
    font-size:10px; letter-spacing:1px; color:var(--paper);
  }
  .social-btn:hover{border-color:var(--lime); color:var(--lime);}
  .social-btn .ic{font-size:14px;}

  .grid-blog{
    margin-top:16px;
    display:grid;
    grid-template-columns:1fr 1.3fr 1fr;
    gap:16px;
    align-items:stretch;
  }
  @media (max-width:900px){ .grid-blog{grid-template-columns:1fr;} }
  .blog-list li{padding:8px 0; border-bottom:1px dashed var(--grey-dim); font-size:11px;}
  .blog-list li:last-child{border-bottom:none;}
  .blog-list li a:hover{color:var(--lime);}
  .blog-list .tag{display:block; font-size:9px; color:var(--wine-bright); margin-bottom:2px; letter-spacing:1px;}

  .welcome-banner{
    background:
      radial-gradient(circle at 30% 20%, rgba(62,134,181,.35), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(194,54,82,.35), transparent 55%),
      var(--black-3);
    border:1px solid var(--grey-dim);
    border-radius:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
  }
  .welcome-banner h3{
    font-family:'Anton',sans-serif;
    font-size:clamp(24px,3.4vw,34px);
    letter-spacing:1px;
    line-height:1.05;
    margin-bottom:8px;
    text-shadow:2px 2px 0 var(--wine), 4px 4px 0 var(--black);
  }
  .welcome-banner p{font-size:11px; color:var(--grey); max-width:300px; margin-bottom:16px;}
  .welcome-banner button{
    background:var(--lime); color:var(--black); border:none; border-radius:999px;
    font-family:'Anton',sans-serif; font-size:11px; letter-spacing:1px; padding:10px 24px;
    box-shadow:0 3px 0 rgba(0,0,0,.4);
  }
  .welcome-banner button:hover{filter:brightness(1.08);}

  .faves-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--grey-dim); font-size:11px;}
  .faves-row:last-child{border-bottom:none;}
  .faves-row .ic{color:var(--wine-bright); margin-right:6px;}
  .faves-row .count{color:var(--lime);}

  .footer-ticker{
    margin-top:26px;
    background:var(--wine);
    color:var(--paper);
    overflow:hidden;
    white-space:nowrap;
    padding:8px 0;
    font-size:10px;
    letter-spacing:2px;
  }
  .footer-ticker .ticker-track{animation-duration:20s;}

  .site-footer{
    background:var(--black);
    border-top:2px solid var(--grey-dim);
    padding:34px 22px 20px;
  }
  .footer-grid{
    max-width:1180px; margin:0 auto;
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr 1.2fr;
    gap:24px;
  }
  @media (max-width:800px){ .footer-grid{grid-template-columns:1fr 1fr;} }
  .footer-col h4{font-family:'Anton',sans-serif; font-size:11px; letter-spacing:1px; margin-bottom:12px; color:var(--grey);}
  .footer-col li{margin-bottom:8px; font-size:11px;}
  .footer-col li a:hover{color:var(--lime);}
  .footer-brand .logo{font-size:20px; margin-bottom:8px;}
  .footer-brand p{font-size:10px; color:var(--grey); line-height:1.7;}
  .social-row{display:flex; gap:10px; margin-top:10px;}
  .social-row a{
    width:28px;height:28px; border:1px solid var(--grey-dim);
    display:flex; align-items:center; justify-content:center; font-size:12px;
  }
  .social-row a:hover{border-color:var(--lime); color:var(--lime);}

  .taskbar{
    position:fixed; left:0; right:0; bottom:0;
    height:34px;
    background:var(--black-3);
    border-top:2px solid var(--grey-dim);
    display:flex;
    align-items:center;
    padding:0 8px;
    gap:8px;
    z-index:50;
  }
  .start-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--wine);
    border:none; color:var(--paper);
    border-radius:4px;
    font-family:'Anton',sans-serif; font-size:11px; letter-spacing:1px;
    padding:5px 12px; height:26px;
  }
  .tab-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--black-2); border:1px solid var(--grey-dim);
    border-radius:4px;
    font-size:10px; color:var(--grey); padding:4px 10px; height:26px;
  }
  .tray{
    margin-left:auto;
    display:flex; align-items:center; gap:12px;
    font-size:11px; color:var(--grey);
  }
  #clock{color:var(--paper); font-size:10px; letter-spacing:.5px;}

  .member-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;}
  .member-card{display:block;border:1px solid var(--grey-dim);background:var(--black-3);padding:8px;transition:transform .2s,border-color .2s;}
  .member-card:hover{transform:translateY(-3px);border-color:var(--blue-bright);}
  .member-photo{aspect-ratio:3/4;background:var(--black-2);overflow:hidden;}
  .member-photo img{width:100%;height:100%;object-fit:cover;}
  .member-name{font-family:'Anton',sans-serif;font-size:12px;letter-spacing:1px;padding:9px 4px 4px;}
  @media (max-width:800px){.member-grid{grid-template-columns:1fr 1fr}}

  .album-modal{display:none;position:fixed;inset:0;background:rgba(11,11,12,.94);z-index:100;overflow:auto;padding:30px 20px;}
  .album-modal.open{display:block;}
  .album-modal-inner{max-width:1000px;margin:0 auto;background:var(--black-2);border:1px solid var(--grey-dim);box-shadow:8px 8px 0 rgba(0,0,0,.5);position:relative;}
  .album-close{position:absolute;right:10px;top:10px;z-index:2;background:var(--wine);border:1px solid var(--grey-dim);color:var(--paper);padding:6px 9px;cursor:pointer;}
  .album-detail-grid{display:grid;grid-template-columns:38% 62%;gap:20px;padding:22px;}
  .album-cover{aspect-ratio:1/1;background:var(--black-3);border:1px solid var(--grey-dim);overflow:hidden;}
  .album-cover img{width:100%;height:100%;object-fit:cover;}
  .album-detail-title{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:14px;}
  .album-track{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--grey-dim);font-size:10px;cursor:pointer;}
  .album-track:hover{color:var(--lime);}
  .album-song-link{display:none;margin-top:14px;padding:12px;background:var(--black-3);border:1px solid var(--grey-dim);font-size:10px;}
  .album-song-link a{color:var(--blue-bright);}
  @media(max-width:700px){.album-detail-grid{grid-template-columns:1fr;}}

  .vote-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .vote-option{display:flex;align-items:center;gap:9px;padding:11px 9px;border-bottom:1px dashed var(--grey-dim);cursor:pointer;font-size:11px;}
  .vote-option:hover{background:var(--black-3);}
  .vote-option input{accent-color:var(--blue-bright);}
  .vote-results{border:1px solid var(--grey-dim);padding:14px;background:var(--black-3);}
  .vote-results>b{font-family:'Anton',sans-serif;letter-spacing:1px;font-size:12px;}
  .result-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--grey-dim);font-size:10px;}
  .result-row strong{font-family:'Anton',sans-serif;font-size:14px;}
  .member-page-inner{max-width:1100px;}
  .member-page-grid{display:grid;grid-template-columns:40% 60%;min-height:600px;}
  .member-page-image{background:var(--black-3);min-height:600px;}
  .member-page-image img{width:100%;height:100%;object-fit:cover;display:block;}
  .member-page-copy{padding:26px;}
  .member-page-copy h1{font-family:'Anton',sans-serif;font-size:40px;letter-spacing:1px;margin-bottom:6px;}
  .member-page-copy h3{font-family:'Anton',sans-serif;font-size:12px;letter-spacing:1px;color:var(--blue-bright);margin:20px 0 6px;}
  .member-page-copy p{font-size:11px;line-height:1.7;color:var(--paper);}
  .member-page-copy ul{margin-top:6px;}
  .member-page-copy ul li{font-size:11px;line-height:1.8;color:var(--paper);padding-left:14px;position:relative;}
  .member-page-copy ul li::before{content:'·';position:absolute;left:4px;color:var(--lime);font-weight:bold;}
  .member-page-copy .member-meta{font-size:11px;color:var(--grey);line-height:1.9;margin-top:6px;}
  .member-page-copy .member-meta b{color:var(--paper);}
  @media(max-width:700px){.vote-layout,.member-page-grid{grid-template-columns:1fr}.member-page-image{min-height:400px}.member-page-copy h1{font-size:30px;}}

  /* ============ UNLOCK TOAST ============ */
  .unlock-toast{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(.9);
    background:var(--black);
    border:2px solid var(--lime);
    border-radius:8px;
    padding:20px 32px;
    font-family:'Anton',sans-serif;
    font-size:22px;
    letter-spacing:2px;
    color:var(--lime);
    text-shadow:2px 2px 0 var(--wine);
    box-shadow:0 0 0 4px rgba(198,255,61,.15), 0 0 40px rgba(198,255,61,.5);
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .3s;
  }
  .unlock-toast.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
